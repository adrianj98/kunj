<!doctype html>
<!-- The Monaco page, served as kunj://app/index.html by MonacoWebView's scheme handler.
     ?mode=diff: the Changes column's read-only diff editor; ?mode=editor: the editor tabs (Task 10).
     The page's functions are in app.js; Swift calls them with one argument object. -->
<html>
<head>
<meta charset="utf-8">
<title>Kunj Workspace</title>
<style>
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono-Regular.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono-Medium.ttf') format('truetype'); font-weight: 500; }
  @font-face { font-family: 'Inter'; src: url('fonts/Inter-Regular.ttf') format('truetype'); font-weight: 400; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
  #c, #diff, #single { position: absolute; inset: 0; }
  /* A whole added or deleted file (app.js showSingle): the diff editor's colours and signs */
  .kunj-add-line, .kunj-add-margin { background: var(--add-bg); }
  .kunj-del-line, .kunj-del-margin { background: var(--del-bg); }
  .kunj-add-sign::before, .kunj-del-sign::before { position: absolute; left: 3px; }
  .kunj-add-sign::before { content: '+'; color: var(--green); }
  .kunj-del-sign::before { content: '\2212'; color: var(--red); }
  /* The diff's +/− signs in the status colours (warm.html); inline mode's original-number
     gutter marks a pure insertion with the delete colour, which reads as a deletion: left plain */
  .monaco-diff-editor .codicon-diff-insert { color: var(--green) !important; }
  .monaco-diff-editor .codicon-diff-remove { color: var(--red) !important; }
  #diff .gutter-delete { background: transparent !important; }
  /* Monaco's own focus outline around the editor is not part of the design */
  .monaco-editor, .monaco-diff-editor { outline: none !important; }
</style>
</head>
<body>
<div id="c"><div id="diff"></div><div id="single"></div></div>
<script src="app.js"></script>
</body>
</html>
